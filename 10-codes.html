<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-Code Mastery - BCPD 180th</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="bg-[#0f172a] text-slate-200 antialiased min-h-screen p-6 font-sans">
  
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="flex items-center gap-4 border-b border-slate-700 pb-6">
      <a href="index.html" class="p-2 hover:bg-slate-800 rounded-lg transition-colors text-slate-400 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-3">
          10-Code Mastery
        </h1>
        <p class="text-slate-400 text-sm mt-1">BCPD Radio Reference</p>
      </div>
    </header>

    <!-- Controls -->
    <div class="flex flex-wrap gap-4 justify-center">
        <button id="btn-flashcards" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition-colors">Flashcards</button>
        <button id="btn-quiz" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition-colors">Multiple Choice Quiz</button>
    </div>

    <!-- Flashcard Mode Container -->
    <div id="flashcard-container" class="flex flex-col items-center gap-6 mt-8">
        <div class="text-slate-400 text-sm mb-2" id="flashcard-progress">Card 1 of --</div>
        
        <div class="flip-card h-64 w-full max-w-md cursor-pointer" onclick="this.classList.toggle('flipped')">
            <div class="flip-card-inner rounded-2xl shadow-lg border border-slate-600">
                <div class="flip-card-front bg-slate-800 rounded-2xl p-6">
                    <span class="text-5xl font-bold text-white" id="fc-front">--</span>
                    <span class="text-sm text-slate-400 mt-4">(Click to flip)</span>
                </div>
                <div class="flip-card-back bg-blue-600 rounded-2xl p-6">
                    <span class="text-3xl font-bold text-white text-center" id="fc-back">--</span>
                </div>
            </div>
        </div>

        <div class="flex gap-4">
            <button id="btn-prev-card" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition-colors">Previous</button>
            <button id="btn-next-card" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition-colors">Next</button>
        </div>
    </div>

    <!-- Quiz Mode Container -->
    <div id="quiz-container" class="hidden flex-col items-center gap-6 mt-8 max-w-2xl mx-auto w-full">
        <div class="w-full flex justify-between text-slate-400 text-sm mb-2">
            <span id="quiz-progress">Question 1 of 10</span>
            <span id="quiz-score">Score: 0</span>
        </div>

        <div class="glass-card w-full rounded-2xl p-8 border-t-4 border-t-blue-500 text-center">
            <h2 class="text-3xl font-bold text-white mb-8" id="quiz-question">What is the meaning of 10-4?</h2>
            
            <div class="grid grid-cols-1 gap-4 w-full" id="quiz-options">
                <!-- Buttons injected via JS -->
            </div>
        </div>
        
        <div id="quiz-result" class="hidden glass-card w-full rounded-2xl p-6 text-center">
            <h3 class="text-2xl font-bold text-white mb-2" id="result-message">Quiz Complete!</h3>
            <p class="text-slate-400 mb-6" id="result-score-text">You scored X out of Y.</p>
            <button id="btn-restart-quiz" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition-colors">Try Again</button>
        </div>
    </div>

  </div>

  <script src="data/codes.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
